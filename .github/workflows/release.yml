name: Moodle Plugin Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Get plugin name
        id: pluginname
        run: |
          echo "name=$(basename $(pwd))" >> $GITHUB_OUTPUT

      - name: Create ZIP file
        run: |
          cd ..
          zip -r ${{ steps.pluginname.outputs.name }}.zip ${{ steps.pluginname.outputs.name }} \
            -x "*.git*" \
            -x "*.github*" \
            -x "*CLAUDE.md*" \
            -x "*UPGRADE_PLAN.md*" \
            -x "*.DS_Store*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ../${{ steps.pluginname.outputs.name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
